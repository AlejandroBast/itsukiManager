[workspace]
resolver = "3"
members = ["crates/itsuki-core", "crates/itsuki-cli", "app/src-tauri"]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/AlejandroBast/itsukiManager"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Perfil para medir rendimiento con símbolos.
[profile.bench]
inherits = "release"
strip = false
debug = true
